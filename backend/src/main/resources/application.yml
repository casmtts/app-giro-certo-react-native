server:
  port: 8080

spring:
  application:
    name: giro-certo-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/giro_certo}
    username: ${SPRING_DATASOURCE_USERNAME:giro_certo}
    password: ${SPRING_DATASOURCE_PASSWORD:giro_certo_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 52MB

app:
  jwt:
    secret: ${JWT_SECRET:local-giro-certo-secret-change-before-deploy-2026}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  uploads:
    directory: ${UPLOADS_DIRECTORY:./uploads}
