services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: giro_certo
      POSTGRES_USER: giro_certo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-giro_certo_dev}
    ports:
      - "5432:5432"
    volumes:
      - giro_certo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giro_certo -d giro_certo"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/giro_certo
      SPRING_DATASOURCE_USERNAME: giro_certo
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-giro_certo_dev}
      JWT_SECRET: ${JWT_SECRET:-local-giro-certo-secret-change-before-deploy-2026}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      UPLOADS_DIRECTORY: /app/uploads
    volumes:
      - giro_certo_photo_storage:/app/uploads
    ports:
      - "8082:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  giro_certo_data:
  giro_certo_photo_storage:
